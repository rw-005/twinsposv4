const fmtH=ts=>new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const fmtDT=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const dur=ms=>{const m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+'j '+(m%60)+'m'};
function normWA(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);return n}
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const ini=n=>{const w=String(n||'').trim().split(/\s+/).filter(Boolean);if(!w.length)return'?';return(w.length>1?Array.from(w[0])[0]+Array.from(w[1])[0]:Array.from(w[0]).slice(0,2).join('')).toUpperCase()};

/* ---------- promo & calc ---------- */
function activePromos(){
 const n=new Date(),t=p2(n.getHours())+':'+p2(n.getMinutes()),d=n.getDay();
 return db.discounts.filter(x=>{
  if(!x.on||!x.days.includes(d))return false;
  return x.start<=x.end?(t>=x.start&&t<x.end):(t>=x.start||t<x.end);
 });
}
function roundAmt(x){const u=+db.settings.roundUnit||0;if(!u)return x;const m=db.settings.roundMode;return m==='up'?Math.ceil(x/u)*u:m==='down'?Math.floor(x/u)*u:Math.round(x/u)*u}
function calc(items,manual,type){
 const st=db.settings;
 const sub=Math.round(sum(items,i=>i.qty*i.price));
 let auto=0;const names=[];
 for(const d of activePromos()){let v=d.type==='pct'?sub*d.value/100:+d.value;v=Math.min(v,sub-auto);auto+=v;names.push(d.name)}
 auto=Math.round(auto);
 let man=manual.type==='pct'?Math.round((sub-auto)*Math.min(manual.val||0,100)/100):Math.min(Math.round(manual.val||0),sub-auto);
 man=Math.max(0,man);
 const net=Math.max(0,sub-auto-man);
 const sp=+st.servicePct||0,tp=+st.taxPct||0,incl=st.taxMode==='incl';
 const svc=(sp>0&&(!st.serviceDineOnly||type==='dine'))?Math.round(net*sp/100):0;
 const base=net+svc;
 const tax=tp>0?(incl?Math.round(base*tp/(100+tp)):Math.round(base*tp/100)):0;
 const raw=base+(incl?0:tax);
 const total=Math.max(0,roundAmt(raw));
 return{sub,auto,names,man,net,svc,svcPct:svc?sp:0,tax,taxPct:tax?tp:0,taxIncl:incl,rounding:total-raw,total};
}

/* ---------- cart ---------- */
function resetCart(){
 S.cart=[];S.manual={type:'pct',val:0};S.orderId=null;S.table='';S.cust='';S.meja=false;S.channel='';S.type=db.settings.tableMode?'dine':'take';
 const mv=$('#mv');if(mv){mv.value='';$('#mt').value='pct'}
 if($('#lines'))renderCart();

function mkPrice(base,ch){
 ch=ch===undefined?(S.type==='online'?S.channel:''):ch;
 const c=ch&&db.settings.online[ch];if(!c||!c.on||!(c.val>0))return base;
 let x=c.mode==='pct'?base*(1+c.val/100):base+c.val;const r=+c.round||0;
 return r?Math.ceil(x/r)*r:Math.round(x);
}
function applyChannel(){S.cart.forEach(l=>{if(!l.manual)l.price=mkPrice(l.base)})}
function addProduct(id){
 const p=db.products.find(x=>x.id===id);if(!p)return;
 if((p.variants||[]).length||(p.toppings||[]).length)return optModal(id);
 addLine(p,null,[]);
}
function addLine(p,v,tops){
 tops=tops||[];
 const key=p.id+'|'+(v?v.name:'')+'|'+tops.map(t=>t.name).sort().join(',');
 const used=sum(S.cart.filter(x=>x.pid===p.id),x=>x.qty);
 if(!p.notrack&&used+1>p.stock){toast('Stok '+p.name+' tidak cukup');return}
 const l=S.cart.find(x=>(x.key||x.pid+'||')===key);
 if(l)l.qty=+(l.qty+1).toFixed(3);
 else{
  const base=Math.max(0,p.price+(v?v.price:0)+sum(tops,t=>t.price));
  const cg=(+p.cogs||0)+(v?+v.cogs||0:0)+sum(tops,t=>+t.cogs||0);
  S.cart.push({pid:p.id,key:key,name:p.name+(v?' ('+v.name+')':''),unit:p.unit,qty:1,price:mkPrice(base),cogs:cg,base:base,cat:p.cat,sent:0,note:tops.length?'+ '+tops.map(t=>t.name).join(', '):'',manual:false});
 }
 renderCart();
}
function renderCart(){
 const oi=$('#oinfo');if(!oi)return;
 const kb=$('#kbtn');if(kb)kb.innerHTML=(db.settings.print.kitchen.on||db.settings.print.bar.on)?`<button class="btn sm" onclick="sendKitchen()">${ic('printer',16)} ${db.settings.print.bar.on?'Dapur/Bar':'Dapur'}</button>`:'';
 oi.innerHTML=`${ic(S.type==='dine'?'table':'bag',16)}<span>${S.type==='online'?esc(CH[S.channel]||'Online'):S.type==='dine'?'Dine In':'Take Away'}${S.type==='dine'&&S.meja&&!S.table?' · Pilih meja':''}${S.table?' · '+esc(S.table):''}${S.cust?' · '+esc(S.cust):''}</span>${S.orderId?'<em>Open Bill</em>':''}`;
 $('#lines').innerHTML=S.cart.length?S.cart.map((l,i)=>`<div class="line"><div><div class="nm" onclick="editPrice(${i})">${esc(l.name)}</div><div class="lp" onclick="editPrice(${i})">${rp(l.price)}/${esc(l.unit)}${l.manual?' · diubah':S.type==='online'&&l.price!==l.base?' · harga '+esc(CH[S.channel]||''):''} ${ic('edit',11)}${l.sent>0&&l.sent>=l.qty?' · <span style="color:var(--ok)">✓ dapur</span>':l.sent>0?' · <span style="color:var(--warn)">+tambahan</span>':''}</div>${l.note?`<div class="lp" style="color:var(--warn);font-style:italic" onclick="editPrice(${i})">📝 ${esc(l.note)}</div>`:''}</div>
  <div class="lq"><button class="qb" onclick="stepQty(${i},-1)">−</button><input type="number" inputmode="decimal" step="any" min="0" value="${l.qty}" onchange="setQty(${i},this.value)"><button class="qb" onclick="stepQty(${i},1)">+</button></div>
  <div class="ls">${rp(l.qty*l.price)}<button class="x" onclick="delLine(${i})">${ic('x',15)}</button></div></div>`).join(''):`<div class="empty">${ic('cart',34)}<div>Keranjang kosong</div></div>`;
 renderTotals();
 if($('#grid'))renderGrid();
}
function renderTotals(){
 if(!$('#tot'))return;
 const c=calc(S.cart,S.manual,S.type);
 $('#tot').innerHTML=`<div><span>Subtotal</span><span>${rp(c.sub)}</span></div>`+
  (c.auto?`<div class="g"><span>Promo (${esc(c.names.join(', '))})</span><span>-${rp(c.auto)}</span></div>`:'')+
  (c.man?`<div class="g"><span>Diskon manual</span><span>-${rp(c.man)}</span></div>`:'')+
  (c.svc?`<div><span>Service ${c.svcPct}%</span><span>${rp(c.svc)}</span></div>`:'')+
  (c.tax?`<div><span>Pajak ${c.taxPct}%${c.taxIncl?' (termasuk)':''}</span><span>${rp(c.tax)}</span></div>`:'')+
  (c.rounding?`<div><span>Pembulatan</span><span>${c.rounding>0?'+':'-'}${rp(Math.abs(c.rounding))}</span></div>`:'')+
  `<div class="gt"><span>Total</span><span>${rp(c.total)}</span></div>`;
 $('#payBtn').textContent=S.cart.length?'Bayar '+rp(c.total):'Bayar';
 $('#payBtn').disabled=!S.cart.length;
}
function stepQty(i,d){const l=S.cart[i],st=l.unit==='pcs'?1:0.5;const q=+(l.qty+d*st).toFixed(3);q<=0?delLine(i):setQty(i,q)}
function setQty(i,v){
 let q=parseFloat(v);const l=S.cart[i],p=db.products.find(x=>x.id===l.pid);
 if(!(q>0)){delLine(i);return}
 if(p&&!p.notrack){
  const other=sum(S.cart.filter((x,k)=>k!==i&&x.pid===l.pid),x=>x.qty);
  const mx=Math.max(0,+(p.stock-other).toFixed(3));
  if(q>mx){toast('Stok tersedia '+fq(p.stock));q=mx;if(!(q>0)){delLine(i);return}}
 }
 l.qty=q;renderCart();
}
function delLine(i){S.cart.splice(i,1);renderCart()}
function clearCart(){if(!S.cart.length&&!S.orderId)return;if(confirm('Kosongkan keranjang'+(S.orderId?' (open bill tetap tersimpan)':'')+'?'))resetCart()}
function editPrice(i){

 openModal(`<h3>Harga &amp; Catatan</h3><div class="mut">${esc(l.name)}</div><label>Harga per ${esc(l.unit)} (Rp)</label><input id="np" type="number" inputmode="numeric" value="${l.price}"><label>Catatan untuk dapur (opsional)</label><input id="nn" value="${esc(l.note||'')}" placeholder="Contoh: tanpa gula, pedas">
 <div class="mrow"><button class="btn" onclick="closeModal()">Batal</button><button class="btn" onclick="$('#np').value=${mkPrice(l.base)}">Harga normal</button><button class="btn pri" onclick="savePrice(${i})">Simpan</button></div>`);

 <label>${S.type==='online'?'No. pesanan / nama pelanggan':'Nama pelanggan (opsional)'}</label><input id="oc" value="${esc(S.cust)}" oninput="S.cust=this.value;renderCart()">

function saveOpenBill(){

function ckHint(){

function payGo(){
 const c=ckCalc();
 if(CK.mode==='items'&&!ckItems().length){toast('Pilih item yang dibayar');return}
 let rem=c.total-paidAp();
 if(c.total<=0){CK.pays=[{m:'tunai',ap:0,tend:0}];return finalize()}
 if(rem>0){
  let a=parseFloat(CK.amt)||0;
  if(!a&&CK.method!=='tunai')a=rem;
  if(!a){toast('Isi nominal pembayaran');return}

  CK.pays.push({m:CK.method,ap,tend:CK.method==='tunai'?a:ap});CK.amt='';

 rem<=0?finalize():renderCk();

 t.items.forEach(i=>{const p=db.products.find(x=>x.id===i.pid);if(p&&!p.notrack)p.stock=+(p.stock-i.qty).toFixed(3)});
 db.tx.push(t);
 const kl=[];S.cart.forEach((l,i)=>{const q=CK.mode==='items'?(CK.sel[i]||0):l.qty;if(q>0){const un=+(q-(l.sent||0)).toFixed(3);if(un>0)kl.push({...l,qty:un});l.sent=Math.max(0,+((l.sent||0)-q).toFixed(3))}});

function mkFmt(paper){
 const W=(paper||db.settings.paper)==='80'?48:32;
 const wrap=s=>{const o=[];let l='';for(const w of String(s).split(/\s+/)){if(!w)continue;if((l+' '+w).trim().length>W){if(l)o.push(l);l=w}else l=(l+' '+w).trim()}if(l)o.push(l);return o};
 return{W,wrap,hr:'-'.repeat(W),
  c:s=>wrap(s).map(x=>' '.repeat(Math.max(0,Math.floor((W-x.length)/2)))+x).join('\n'),
  lr:(l,r)=>{l=String(l);r=String(r);const sp=W-l.length-r.length;return sp>0?l+' '.repeat(sp)+r:l+'\n'+' '.repeat(Math.max(0,W-r.length))+r}};
}
function head(f,title){const st=db.settings;return[f.c(st.name),f.c(st.address),f.c('WA: '+st.wa),...(title?[f.hr,f.c(title)]:[]),f.hr]}
function receiptText(t){
 const f=mkFmt(),{lr,c,hr,wrap}=f;
 const L=[...head(f),lr('No',t.no),lr('Tgl',fmtT(t.ts)),lr('Kasir',t.cashier),lr('Tipe',typeLabel(t.type,t.channel))];
 if(t.table)L.push(lr('Meja',t.table));
 if(t.custName)L.push(lr('Pelanggan',t.custName));
 L.push(hr);
 t.items.forEach(i=>{L.push(...wrap(i.name));if(i.note)L.push(...wrap('  '+i.note));L.push(lr('  '+fq(i.qty)+' '+i.unit+' x '+num(i.price),num(i.qty*i.price)))});
 L.push(hr,lr('Subtotal',num(t.subtotal)));
 if(t.autoDisc)L.push(lr('Promo '+t.autoNames.join(','),'-'+num(t.autoDisc)));
 if(t.manualDisc)L.push(lr('Diskon','-'+num(t.manualDisc)));
 if(t.service)L.push(lr('Service '+t.svcPct+'%',num(t.service)));
 if(t.tax)L.push(lr('Pajak '+t.taxPct+'%'+(t.taxIncl?' (incl)':''),num(t.tax)));
 if(t.rounding)L.push(lr('Pembulatan',(t.rounding>0?'+':'-')+num(Math.abs(t.rounding))));
 L.push(lr('TOTAL',num(t.total)),hr);
 t.payments.forEach(p=>L.push(lr(METHODS[p.m],num(p.m==='tunai'?p.tend:p.ap))));
 if(t.change)L.push(lr('Kembali',num(t.change)));
 if(t.customer)L.push(lr('Kasbon a/n',t.customer.name),c('** KASBON - BELUM LUNAS **'));
 const rf=db.refunds.filter(r=>r.txId===t.id);
 if(rf.length){L.push(hr,c('RETUR / REFUND'));rf.forEach(r=>L.push(lr(r.no,'-'+num(r.amount)),lr('  '+METHODS[r.method],fmtH(r.ts))));L.push(lr('Total retur','-'+num(t.refunded)),lr('Nilai bersih',num(t.total-t.refunded)));
  if(t.status==='void')L.push(c('*** REFUND PENUH ***'))}
 L.push(hr,c(db.settings.footer),c('Powered by TWINS POS'));
 return L.join('\n');
}

function rangeOf(p,from,to){
 const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
 if(p==='today')return[d0,d0+864e5];
 if(p==='7d')return[d0-6*864e5,d0+864e5];
 if(p==='month')return[new Date(n.getFullYear(),n.getMonth(),1).getTime(),d0+864e5];

 return[from?new Date(from).getTime():0,to?new Date(to).getTime()+60000:Infinity];
}

function savePrint(){
 const g=id=>$('#'+id).value,b=id=>g(id)==='true',n=id=>Math.max(1,Math.min(5,parseInt(g(id))||1));
 const P=db.settings.print;db.settings.paper=g('p_rp');
 Object.assign(P.receipt,{copies:n('p_rc'),auto:b('p_ra')});
 Object.assign(P.kitchen,{on:b('p_ko'),paper:g('p_kp'),copies:n('p_kc'),title:g('p_kt').trim()||'DAPUR',direct:b('p_kd'),onPay:b('p_kg'),cats:[...document.querySelectorAll('#p_kcats input:checked')].map(x=>x.value)});
 Object.assign(P.bar,{on:b('p_bo'),paper:g('p_bp'),copies:n('p_bc'),title:g('p_bt').trim()||'BAR',direct:b('p_bd'),onPay:b('p_bg'),cats:[...document.querySelectorAll('#p_bcats input:checked')].map(x=>x.value)});
 Object.assign(P.checker,{on:b('p_co'),paper:g('p_cp'),copies:n('p_cc'),title:g('p_ct').trim()||'CHECKER',auto:b('p_ca')});
 save();toast('Pengaturan printer tersimpan');setModal('print');
}

function formModal(title,fields,vals,onSave,back){
 const h=fields.map(f=>{
  const v=vals[f.k];
  if(f.t==='select')return`<label>${f.l}</label><select id="f_${f.k}">${f.o.map(([a,b])=>`<option value="${a}" ${String(a)===String(v)?'selected':''}>${b}</option>`).join('')}</select>`;
  if(f.t==='days')return`<label>${f.l}</label><div class="days" id="f_${f.k}">${DAYS.map((d,i)=>`<label><input type="checkbox" value="${i}" ${(v||[]).includes(i)?'checked':''}>${d}</label>`).join('')}</div>`;
  if(f.t==='photo')return`<label>${f.l}</label><div id="ph_prev">${v?`<img src="${v}">`:ic('image',28)}</div><div class="quick"><button type="button" class="btn sm" onclick="$('#ph_in').click()">${ic('camera',14)} Pilih / Ambil Foto</button><button type="button" class="btn sm" onclick="window._ph='';$('#ph_prev').innerHTML=ic('image',28)">Hapus</button></div><input type="file" id="ph_in" accept="image/*" style="display:none" onchange="pickPhoto(this)">`;
  return`<label>${f.l}</label><input id="f_${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="any" inputmode="decimal"':''} value="${esc(v==null?'':v)}" ${f.max?'maxlength="'+f.max+'"':''}>`;
 }).join('');
 openModal(`<h3>${esc(title)}</h3>${h}<div class="err" id="fe"></div><div class="mrow"><button class="btn" id="fc">Batal</button><button class="btn pri" id="fs">Simpan</button></div>`);
 $('#fc').onclick=back;
 $('#fs').onclick=()=>{
  const o={};
  fields.forEach(f=>{
   if(f.t==='days')o[f.k]=[...document.querySelectorAll('#f_'+f.k+' input:checked')].map(x=>+x.value);
   else if(f.t==='photo')o[f.k]=window._ph||'';
   else{const x=$('#f_'+f.k).value;o[f.k]=f.t==='number'?parseFloat(x):x}
  });
  const err=onSave(o);
  if(err){$('#fe').textContent=err;return}
  save();back();
 };
}
function pickPhoto(inp){
 const f=inp.files[0];if(!f)return;
 const img=new Image(),url=URL.createObjectURL(f);
 img.onload=()=>{
  const M=320,sc=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  window._ph=c.toDataURL('image/jpeg',.75);URL.revokeObjectURL(url);
  $('#ph_prev').innerHTML=`<img src="${window._ph}">`;
 };
 img.onerror=()=>toast('Foto tidak bisa dibaca');
 img.src=url;
}
function prodForm(id){
 const p=db.products.find(x=>x.id===id)||{name:'',cat:'',unit:'pcs',price:0,cogs:0,stock:'',notrack:true,barcode:'',photo:'',variants:[],toppings:[]};
 window._ph=p.photo||'';
 formModal(id?'Ubah Produk':'Produk Baru',[{k:'photo',l:'Foto produk',t:'photo'},{k:'name',l:'Nama item'},{k:'cat',l:'Kategori'},{k:'unit',l:'Satuan (pcs / kg / liter / meter …)'},{k:'price',l:'Harga jual (Rp)',t:'number'},{k:'cogs',l:'Harga modal / COGS (Rp)',t:'number'},{k:'stock',l:'Stok (kosongkan jika tidak perlu dihitung)',t:'number'},{k:'barcode',l:'Kode barcode'}],{...p,photo:window._ph,stock:p.notrack?'':p.stock},o=>{
  if(!o.name.trim())return'Nama wajib diisi';
  if(isNaN(o.price)||isNaN(o.cogs))return'Harga jual dan harga modal harus berupa angka';
  const vs=optRead('v','varian');if(vs.err){toast(vs.err);return vs.err}
  const ts=optRead('t','topping');if(ts.err){toast(ts.err);return ts.err}

function parseCSV(txt){
 txt=txt.replace(/^﻿/,'').replace(/^sep=.\r?\n/i,'');
 const first=txt.split(/\r?\n/)[0]||'',dl=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===dl){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x!==''))rows.push(row);
 if(!rows.length)return[];
 const h=rows[0];return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]==null?'':r[i]])));
}

  if(m&&!Object.values(map).some(x=>x.id===m.id)){const p=pool[m.id];if(p){p.manual=true;try{p.dev.gatt.disconnect()}catch(e){}delete pool[m.id]}}
  refresh();
 }
 const state=role=>{const m=map[role],c=cfg.roles[role]||{};return{id:m?m.id:'',name:m?m.name:'',on:m?isOn(m.id):false,mode:modeOf(role),ip:c.ip||'',port:c.port||9100,cut:c.cut!==false}};
 const devices=()=>Object.values(pool).map(p=>({id:p.id,name:p.name,on:isOn(p.id)}));
 async function ensure(role){
  const m=map[role];if(!m)return false;
  const p=pool[m.id];if(!p)return false;
  if(isOn(m.id))return true;
  try{p.manual=false;await link(p);refresh();return true}catch(e){return false}
 }
 // sambung otomatis ke printer yang pernah dipilih (bila browser mengizinkan)
 try{
  if(navigator.bluetooth&&navigator.bluetooth.getDevices){
   navigator.bluetooth.getDevices().then(async list=>{
    for(const d of list){
     if(!Object.keys(map).some(r=>map[r].id===d.id))continue;
     const p=reg(d);watch(p);
     try{await link(p)}catch(e){}
    }
    refresh();
   }).catch(()=>{});
  }
 }catch(e){}

 const enc=new TextEncoder();
 const clean=t=>String(t).replace(/[·•]/g,'-').replace(/[−–—]/g,'-').replace(/×/g,'x').replace(/[^\x20-\x7E\n]/g,'');
 async function send(p,bytes){
  for(let i=0;i<bytes.length;i+=100){
   const c=bytes.slice(i,i+100);
   if(p.chr.properties.writeWithoutResponse)await p.chr.writeValueWithoutResponse(c);else await p.chr.writeValue(c);
   await new Promise(r=>setTimeout(r,35));
  }
 }
 async function sendText(role,txt,copies){
  const p=pool[map[role].id];
  const body=enc.encode(clean(txt)+'\n\n\n\n');
  const all=new Uint8Array(2+body.length);
  all.set([0x1B,0x40],0);all.set(body,2);
  for(let k=0;k<copies;k++)await send(p,all);
 }
 const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
 function makeBytes(txt,copies,cut){
  const body=enc.encode(clean(txt)+'\n\n\n\n'),parts=[];
  for(let k=0;k<copies;k++){parts.push(new Uint8Array([0x1B,0x40]),body);if(cut)parts.push(new Uint8Array([0x1D,0x56,0x42,0x00]))}
  const o=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let x=0;parts.forEach(p=>{o.set(p,x);x+=p.length});return o;
 }
 const relayURL=()=>cfg.relay.replace(/\/+$/,'');
 async function lanSend(role,txt,copies){
  const c=cfg.roles[role]||{};
  if(!cfg.relay)throw new Error('alamat relay belum diisi');
  if(!c.ip)throw new Error('IP printer belum diisi');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
  try{
   const r=await fetch(relayURL()+'/print',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({ip:c.ip,port:+c.port||9100,data:b64(makeBytes(txt,copies,c.cut!==false))}),signal:ctl.signal});
   const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
  }catch(e){throw new Error(e.name==='AbortError'?'relay tidak merespons':e.message==='Failed to fetch'?'relay tidak terjangkau (cek alamat/jaringan)':e.message)}
  finally{clearTimeout(t)}
 }
 async function ping(){
  if(!cfg.relay){toast('Isi alamat relay dulu');return}
  try{const r=await fetch(relayURL()+'/ping');const j=await r.json();toast(j.ok?'Relay aktif ✓':'Relay tidak valid')}
  catch(e){toast('Relay tidak terjangkau. Cek alamat dan pastikan relay menyala.')}
 }
 const roleOf=k=>k==='z'?'receipt':(ROLES[k]?k:'receipt');
 printJobs=async function(jobs){
  const rest=[],done=new Set();
  for(const j of jobs){
   const role=roleOf(j.kind),mode=modeOf(role),copies=Math.max(1,pcfg(j.kind).copies|0);
   if(mode==='lan'){
    try{await lanSend(role,j.txt,copies);done.add(ROLES[role])}
    catch(e){toast('Cetak LAN '+ROLES[role]+' gagal: '+e.message+' - memakai cetak biasa');rest.push(j)}
    continue;
   }
   if(mode!=='bt'||!(await ensure(role))){rest.push(j);continue}
   try{await sendText(role,j.txt,copies);done.add(ROLES[role])}
   catch(e){toast('Cetak '+ROLES[role]+' gagal: '+e.message+' - memakai cetak biasa');rest.push(j)}
  }
  if(done.size)toast('Dikirim ke printer: '+[...done].join(', '));
  if(rest.length)await origPrint(rest);
 };
 async function test(role){
  const f=mkFmt(role==='receipt'?db.settings.paper:db.settings.print[role].paper);
  const txt=[f.c('*** TES PRINTER ***'),f.c(ROLES[role].toUpperCase()),f.hr,f.lr('Waktu',fmtT(Date.now())),f.hr,f.c('Printer terhubung dengan baik')].join('\n');
  const m=modeOf(role);
  if(m==='lan'){try{await lanSend(role,txt,1);toast('Tes terkirim ke '+cfg.roles[role].ip)}catch(e){toast('Tes LAN gagal: '+e.message)}return}
  if(m!=='bt'){toast('Pilih metode Bluetooth atau LAN dulu.');return}
  if(!(await ensure(role))){toast('Printer '+ROLES[role]+' belum tersambung. Pilih printer dulu.');return}
  try{await sendText(role,txt,1);toast('Tes terkirim ke '+map[role].name)}catch(e){toast('Tes gagal: '+e.message)}
 }
 window.BT={paint,roles:ROLES,state,devices,connect,use,clear,test,setMode,setLan,setRelay,ping,relay:()=>cfg.relay};
})();

/* layar penuh */
(function(){
 const K='twinspos_fs',el=document.documentElement;
 const auto=()=>{try{return localStorage.getItem(K)!=='0'}catch(e){return true}};
 const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
 let entered=false,warned=false;
 const fail=m=>{if(warned)return;warned=true;toast('Layar penuh ditolak browser'+(m?': '+m:'')+'. Coba buka lewat Chrome.')};
 const enter=()=>{
  const f=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!f){fail('tidak didukung');return false}
  try{const r=f.call(el);if(r&&r.catch)r.catch(e=>fail(e&&e.message))}catch(e){fail(e&&e.message)}
  return true;
 };
 const exit=()=>{const f=document.exitFullscreen||document.webkitExitFullscreen;if(!f)return;try{const r=f.call(document);if(r&&r.catch)r.catch(()=>{})}catch(e){}};
 ['fullscreenchange','webkitfullscreenchange'].forEach(t=>document.addEventListener(t,()=>{if(isFs())entered=true}));
 const evs=['pointerup','touchend','click','keydown'];
 const tap=()=>{if(entered||!auto()||isFs())return;enter()};
 evs.forEach(t=>document.addEventListener(t,tap,true));
 window.FS={toggle(){if(isFs())exit();else{warned=false;enter()}},auto,setAuto(v){try{localStorage.setItem(K,v?'1':'0')}catch(e){}toast(v?'Layar penuh otomatis aktif':'Layar penuh otomatis dimatikan')}};
})();

/* ===== Varian & Topping (maks. MAXOPT per produk) ===== */
const MAXOPT=20;
function parseOpts(str,what){
 const out=[],seen={};
 const parts=String(str==null?'':str).split(/[\n;|]+/).map(s=>s.trim()).filter(Boolean);
 if(parts.length>MAXOPT)return{err:'Maksimal '+MAXOPT+' '+what+' per produk (sekarang '+parts.length+')'};
 for(const s of parts){
  const a=s.split(':'),name=a[0].trim();
  if(!name)return{err:'Nama '+what+' kosong: "'+s+'"'};
  const price=(a[1]===undefined||a[1].trim()==='')?0:toNum(a[1]);
  const cogs=(a[2]===undefined||a[2].trim()==='')?0:toNum(a[2]);
  if(isNaN(price)||isNaN(cogs))return{err:'Harga '+what+' "'+name+'" tidak valid'};
  const k=name.toLowerCase();
  if(seen[k])return{err:'Nama '+what+' dobel: '+name};
  seen[k]=1;
  out.push({name:name,price:Math.round(price),cogs:Math.round(cogs)});
 }
 return{list:out};
}
function fmtOpts(list,sep){return(list||[]).map(o=>o.name+':'+o.price+(o.cogs?':'+o.cogs:'')).join(sep)}
function optInfo(p){
 const nv=(p.variants||[]).length,nt=(p.toppings||[]).length;
 return(nv||nt)?' · '+[nv?nv+' varian':'',nt?nt+' topping':''].filter(Boolean).join(', '):'';
}

/* --- editor baris di form produk --- */
function optRowHTML(o){
 return`<div class="orow" data-cogs="${+o.cogs||0}"><input class="on" maxlength="40" placeholder="Nama" value="${esc(o.name||'')}"><input class="op" type="number" step="any" inputmode="numeric" placeholder="+ Harga" value="${o.price?o.price:''}"><button type="button" class="ib" aria-label="Hapus baris" onclick="optRowDel(this)">${ic('x',16)}</button></div>`;
}
function optBox(kind,title,hint,list){
 return`<div class="obox" id="ob_${kind}" data-k="${kind}"><label>${title} <span class="mut" id="obc_${kind}"></span></label><div class="mut" style="font-size:12.5px;margin:-2px 0 8px">${hint}</div><div class="orows">${(list||[]).map(optRowHTML).join('')}</div><button type="button" class="btn sm" id="oba_${kind}" onclick="optRowAdd('${kind}')">${ic('plus',14)} Tambah</button></div>`;
}
function optCount(kind){
 const rows=document.querySelector('#ob_'+kind+' .orows');if(!rows)return;
 const n=rows.children.length,c=document.getElementById('obc_'+kind),b=document.getElementById('oba_'+kind);
 if(c)c.textContent='('+n+'/'+MAXOPT+')';
 if(b)b.disabled=n>=MAXOPT;
}
function optRowAdd(kind){
 const rows=document.querySelector('#ob_'+kind+' .orows');if(!rows)return;
 if(rows.children.length>=MAXOPT){toast('Maksimal '+MAXOPT+' per produk');return}
 rows.insertAdjacentHTML('beforeend',optRowHTML({}));optCount(kind);
 const f=rows.lastElementChild.querySelector('.on');if(f)f.focus();
}
function optRowDel(btn){
 const row=btn.closest('.orow'),box=btn.closest('.obox');if(!row||!box)return;
 row.remove();optCount(box.dataset.k);
}
function optRead(kind,what){
 const out=[],seen={};
 for(const r of document.querySelectorAll('#ob_'+kind+' .orow')){
  const name=r.querySelector('.on').value.trim(),pv=r.querySelector('.op').value.trim();
  if(!name&&!pv)continue;
  if(!name)return{err:'Nama '+what+' belum diisi (ada baris yang hanya berisi harga)'};
  const price=pv===''?0:toNum(pv);
  if(isNaN(price))return{err:'Harga '+what+' "'+name+'" tidak valid'};
  const k=name.toLowerCase();
  if(seen[k])return{err:'Nama '+what+' dobel: '+name};
  seen[k]=1;
  out.push({name:name,price:Math.round(price),cogs:+(r.dataset.cogs||0)||0});
 }
 if(out.length>MAXOPT)return{err:'Maksimal '+MAXOPT+' '+what+' per produk'};
 return{list:out};
}

/* --- pilih varian & topping saat memesan --- */
let OPS={id:'',v:-1,t:[]};
function optModal(id){
 const p=db.products.find(x=>x.id===id);if(!p)return;
 OPS={id:id,v:(p.variants||[]).length?0:-1,t:[]};
 optRender(0);
}
function optTog(i){const k=OPS.t.indexOf(i);if(k>=0)OPS.t.splice(k,1);else OPS.t.push(i);optRender()}
function optPick(){
 const p=db.products.find(x=>x.id===OPS.id);if(!p)return null;
 const vs=p.variants||[],ts=p.toppings||[];
 return{p:p,vs:vs,ts:ts,v:OPS.v>=0?vs[OPS.v]:null,sel:OPS.t.map(i=>ts[i]).filter(Boolean)};
}
function optRender(keepScroll){
 const o=optPick();if(!o)return;
 const top=keepScroll===0?0:($('#sheet')?$('#sheet').scrollTop:0);
 const p=o.p,tot=Math.max(0,p.price+(o.v?o.v.price:0)+sum(o.sel,t=>t.price));
 const sg=n=>n?'<br><small>'+(n>0?'+':'-')+rp(Math.abs(n))+'</small>':'';
 openModal(`<h3>${esc(p.name)}</h3><div class="mut">${rp(p.price)} /${esc(p.unit)}</div>
 ${o.vs.length?`<label>Varian (pilih satu)</label><div class="optg">${o.vs.map((x,i)=>`<button class="btn ${OPS.v===i?'on':''}" onclick="OPS.v=${i};optRender()">${esc(x.name)}${sg(x.price)}</button>`).join('')}</div>`:''}
 ${o.ts.length?`<label>Topping (boleh lebih dari satu)</label><div class="optg">${o.ts.map((x,i)=>`<button class="btn ${OPS.t.includes(i)?'on':''}" onclick="optTog(${i})">${esc(x.name)}${sg(x.price)}</button>`).join('')}</div>`:''}
 <div class="optf"><div class="sumbox"><div class="t"><span>Harga satuan</span><span>${rp(mkPrice(tot))}</span></div></div>
 <div class="mrow"><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" onclick="optAdd()">Tambah ke Keranjang</button></div></div>`);
 if(top)$('#sheet').scrollTop=top;
}
function optAdd(){
 const o=optPick();if(!o)return;
 closeModal();addLine(o.p,o.v,o.sel);
}

renderApp();
